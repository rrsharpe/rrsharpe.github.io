<mat-toolbar color="primary" class="nav-toolbar">
  <span class="toolbar-title">Ryan Sharpe</span>
  <span class="toolbar-spacer"></span>
  <a mat-button href="#about">About</a>
  <a mat-button href="#experience">Experience</a>
  <a mat-button href="#contact">Contact</a>
  <button
    mat-icon-button
    (click)="toggleTheme()"
    [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
  >
    <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>
<div>
  <div id="about" class="section">
    <div class="content">
      <app-greeting-card></app-greeting-card>
    </div>
  </div>
  <div id="experience" class="section">
    <div class="content">
      <h2>Experience:</h2>
      @for (jobDescription of jobs; track $index) {
        <app-experience-card [job]="jobDescription"></app-experience-card>
      }
    </div>
  </div>
  <div id="contact" class="section">
    <div class="content">
      <app-contact-card></app-contact-card>
    </div>
  </div>
</div>
